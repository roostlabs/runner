# Every push and pull request: the same checks `make check` runs locally, plus
# the installer lint and the container-backed tests, which the GitHub runner can
# do because it ships with Docker.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files need gofmt:"; echo "$out"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: lint the installer
        run: make lint-install

      - name: build
        run: make build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the container
        run: docker build --build-arg VERSION=ci -t runner:ci .
      - name: the container runs the binary as a non-root user
        run: |
          test "$(docker run --rm --entrypoint id runner:ci -u)" = 1000
          docker run --rm runner:ci -version
          docker run --rm --entrypoint sh runner:ci -c 'git --version && docker --version'
