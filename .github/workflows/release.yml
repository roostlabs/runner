# A tag v* becomes a GitHub release carrying what install.sh downloads: one
# tarball per platform with a checksum beside it. The installer refuses a
# checksum mismatch and warns when a checksum is missing, so both files matter.
#
# The same tag also publishes the container image docker-compose.yml pulls,
# for amd64 and arm64, as ghcr.io/roostlabs/runner:<tag> and :latest.
#
# The release notes are the tag's own annotation; write them when tagging.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: go test ./...

      - name: build the tarballs
        run: make dist VERSION=${GITHUB_REF_NAME}

      - name: verify what was built
        run: |
          cd dist
          sha256sum -c *.sha256
          for f in *.tar.gz; do tar -tzf "$f" | grep -qx roost-runner || { echo "$f lacks the binary"; exit 1; }; done

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "$notes" --verify-tag

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/roostlabs/runner:${{ github.ref_name }}
            ghcr.io/roostlabs/runner:latest
